[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nusantaracare-rag"
version = "1.0.0"
description = "NusantaraCare RAG Customer Service AI"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "python-dotenv",
    "groq",
    "fastembed",
    "faiss-cpu",
    "numpy",
    "pydantic"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"